# Release pipeline — versioned-release-pipeline, Track release-ci.
#
# Builds and pushes the MATCHED, version-pinned image set
#   ghcr.io/xeonice/cap-api
#   ghcr.io/xeonice/cap-web
#   ghcr.io/xeonice/cap-aio-sandbox
#   ghcr.io/xeonice/cap-boxlite-sandbox
# ALL first published with the SINGLE release version (`github.event.release.tag_name`,
# e.g. vX.Y.Z). Only after all four version tags exist does one promotion gate
# move every `latest` tag to that release, so `latest` never advances merely
# because the API or one matrix member happened to finish first. One Release is
# therefore one mutually-compatible set
# (design D2 / decision ⑤). Each image is injected with the version build-args
# (`CAP_VERSION`/`GIT_SHA`/`BUILD_TIME`) so the published api self-reports via
# `GET /version` and the web bundle bakes its build id (`VITE_BUILD_ID`). The
# cap-aio-sandbox image's coupled triplet (AIO base tag + codex + openspec) is
# surfaced as overridable build-args here but DEFAULTS to the pinned values in
# docker/aio-sandbox.Dockerfile (never `:latest`).
#
# THE RELEASE ALSO PUBLISHES THE HOSTED CONSOLE (couple-console-deploy-to-the-release).
# Vercel's git integration used to publish it on every merge to `main`, so the
# console was a second version of the product on its own cadence: measured at the
# time, `main` sat 19 commits past the newest tag with 10 of them touching
# `apps/web` or `packages/contracts`, including a wire shape that moved. That path
# is now off (`apps/web/vercel.json` sets `git.deploymentEnabled.main = false`) and
# `deploy-console` below replaces it. Pull-request previews are unaffected — they
# deploy from their own branch and make no version claim.
#
# REQUIRED REPOSITORY SECRETS for that job: VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. All three are set. The ids are not secret (a team id and a
# project id); the token is.
#
# THE TOKEN MUST BE A USER/TEAM TOKEN, NOT A PROJECT-SCOPED ONE. Vercel's API
# will happily mint a token scoped to one project (`POST /v3/user/tokens` with a
# `projectId`), and that token genuinely works against the REST API — it reads
# cap-web and 404s on every other project, which was verified. But it CANNOT
# drive the CLI: `vercel whoami` answers "User not found", because a project
# token has no user for the CLI to resolve, and the CLI resolves one before doing
# anything else. Such a token was minted, tested, found unusable here, and
# revoked. Do not re-derive that; it costs an afternoon.
#
# The consequence is worth stating rather than hiding: the token this job uses
# can reach every project in the team, because the CLI path offers no narrower
# option. If that ever matters more than the convenience of the CLI, the way out
# is to drive the deploy through the REST API with a project-scoped token, which
# is a different and larger job than this one.
#
# To rotate:
#   curl -X POST 'https://api.vercel.com/v3/user/tokens?teamId=<team id>' \
#     -H "Authorization: Bearer <an existing user token>" \
#     -H 'Content-Type: application/json' -d '{"name":"cap-release-console"}'
#   gh secret set VERCEL_TOKEN --repo Xeonice/cloud-agent-platform < <file holding it>
# then revoke the old one via DELETE /v3/user/tokens/<id>.
#
# EXERCISE THE NEW TOKEN BEFORE INSTALLING IT, not after — a GitHub secret cannot
# be read back, so a token installed untested stays untested until a release
# depends on it. Run the whole chain against `--environment=preview`
# (pull → build → deploy --prebuilt); a preview publishes nothing to
# cap-console.douglasdong.com. The token currently installed was exercised that
# way; two earlier ones were minted, partially tested, and revoked, because
# "same kind of token, therefore same behaviour" is the reasoning this repository
# keeps disproving.
#
# Learn from `release-please.yml`: a workflow that LOOKS correct is not evidence it
# ran. That one needed a non-`GITHUB_TOKEN` PAT and silently did not fire without
# it. So after the first release, CONFIRM a production deployment appeared —
# `vercel ls cap-web` — rather than reading this file and assuming.
#
# INERT UNTIL A RELEASE IS CUT (design D3): the only triggers are
# `release: published` and the manual `workflow_dispatch`. Merely committing or
# pushing this file builds and pushes NOTHING — a normal push to any branch does
# not match either trigger. The first real publish happens when the operator
# publishes a GitHub Release.

name: release

on:
  # Publishing a GitHub Release `vX.Y.Z` is the ONLY automatic trigger. A plain
  # push never matches, so committing this workflow is inert.
  release:
    types: [published]
  # Manual re-run (e.g. to re-push a set or build off a chosen tag). The version
  # is taken from the `version` input here, since there is no release payload.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build and push (e.g. v1.2.3)."
        required: true
        type: string
      deploy_console:
        description: >-
          Also publish the hosted console. OFF by default so an ordinary manual
          re-run of the image set cannot move the console; ON to rehearse the
          console deploy without cutting a release. A rehearsal is how the two
          silent-success defects in this job were found — a wrong-project link
          and a wrong working directory, both of which would have gone green.
        required: false
        default: false
        type: boolean

# Least-privilege: write to GHCR (packages) only; read the repo to build.
permissions:
  contents: read
  packages: write

env:
  CODEX_VERSION: "0.144.1"
  CLAUDE_CODE_VERSION: "2.1.207"
  OPENSPEC_VERSION: "1.4.1"

jobs:
  # Gate: the source-free run package's INLINE observability configs must match their
  # canonical source (deploy/observability/*) and be `$`-escaped, so a Release never ships a
  # stale or interpolation-broken docker-compose.prod.yml. Generated by
  # gen-prod-observability-configs.mjs; this fails the release on drift (release-and-versioning).
  verify-run-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify inline observability configs are in sync and escaped
        run: node deploy/observability/gen-prod-observability-configs.mjs --check

  # Resolve one release identity once so every image receives the exact same
  # version, build timestamp, and GIT_SHA. The API image gate, the remaining
  # image matrix, AND the task-model attestation all consume these immutable
  # outputs rather than resolving independently — the single source of truth
  # that guards against SHA-context drift between the image build-arg and the
  # attested buildIdentity (automate-task-model-attestation-in-ci, design D1).
  resolve-release:
    needs: verify-run-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_time: ${{ steps.version.outputs.build_time }}
      git_sha: ${{ steps.version.outputs.git_sha }}
    steps:
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "No version available (no release tag and no workflow_dispatch input)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # Build the production API artifact into the local Docker image store, prove
  # both its packaged Git executable and its real startup preflight, and only
  # then authenticate and push those exact local tags. No other image job can
  # begin pushing until this job has passed.
  build-smoke-push-api:
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local cap-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/xeonice/cap-api:${{ needs.resolve-release.outputs.version }}
          build-args: |
            CAP_VERSION=${{ needs.resolve-release.outputs.version }}
            GIT_SHA=${{ needs.resolve-release.outputs.git_sha }}
            BUILD_TIME=${{ needs.resolve-release.outputs.build_time }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            OPENSPEC_VERSION=${{ env.OPENSPEC_VERSION }}

      - name: Smoke built cap-api image
        run: |
          node scripts/cap-api-image-smoke.mjs \
            --image "ghcr.io/xeonice/cap-api:${{ needs.resolve-release.outputs.version }}" \
            --pull never \
            --negative-fixture

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified cap-api version image
        run: docker push "ghcr.io/xeonice/cap-api:${{ needs.resolve-release.outputs.version }}"

      - name: Set cap-api package visibility public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/cap-api/visibility" \
            -f visibility=public

  build-push:
    needs: [resolve-release, build-smoke-push-api]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Build every image even if one fails, so a partial failure is visible
      # per-image rather than masking the rest.
      fail-fast: false
      matrix:
        include:
          - name: cap-web
            dockerfile: apps/web/Dockerfile
            platforms: linux/amd64
          - name: cap-aio-sandbox
            dockerfile: docker/aio-sandbox.Dockerfile
            platforms: linux/amd64
          - name: cap-boxlite-sandbox
            dockerfile: docker/boxlite-sandbox.Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          # Build from the repo root so each monorepo Dockerfile can COPY the
          # workspace (packages/contracts + the app), matching docker-compose.yml.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/xeonice/${{ matrix.name }}:${{ needs.resolve-release.outputs.version }}
          # Version build-args injected into EVERY image so the published api
          # self-reports via /version and the web bundle bakes its build id.
          # VITE_BUILD_ID is consumed by apps/web/Dockerfile; the api/sandbox
          # Dockerfiles consume CAP_VERSION/GIT_SHA/BUILD_TIME. Build-args a
          # given Dockerfile does not declare are simply ignored, so the same
          # block is safe across release images. The cap-aio-sandbox triplet
          # (AIO base tag + codex + openspec) is left to the pinned defaults in
          # docker/aio-sandbox.Dockerfile (never overridden to :latest here).
          build-args: |
            CAP_VERSION=${{ needs.resolve-release.outputs.version }}
            GIT_SHA=${{ needs.resolve-release.outputs.git_sha }}
            BUILD_TIME=${{ needs.resolve-release.outputs.build_time }}
            VITE_BUILD_ID=${{ needs.resolve-release.outputs.version }}
            CODEX_VERSION=${{ env.CODEX_VERSION }}
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            OPENSPEC_VERSION=${{ env.OPENSPEC_VERSION }}

      # Make the published package publicly pullable so self-hosters
      # `docker pull` without auth (design D3 / decision: GHCR packages public).
      # The package exists only after the push above. This is best-effort: on a
      # brand-new package the owner may still need the one-time GHCR UI setting
      # documented in deploy/DEPLOY.md, hence continue-on-error.
      - name: Set ${{ matrix.name }} package visibility public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ matrix.name }}/visibility" \
            -f visibility=public

  # Every immutable version image must be present before any moving tag advances.
  # `imagetools create` promotes the registry manifest itself instead of pulling,
  # retagging, and pushing one host platform; this preserves BoxLite's amd64/arm64
  # manifest list as well as the single-platform manifests of the other images.
  # Split from `promote-latest` so the console can be published BETWEEN verifying
  # the image set and moving `latest` onto it. The two used to be one job, which
  # put `latest` on the new images before the console existed: a console failure
  # then left anyone pulling `latest` with new images and the previous console —
  # the exact split-version state this coupling exists to prevent. Now a console
  # failure leaves `latest` on the last release, so the coordinated pair stays
  # coordinated.
  verify-image-set:
    needs: [resolve-release, build-smoke-push-api, build-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the complete immutable image set
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          for image in cap-api cap-web cap-aio-sandbox cap-boxlite-sandbox; do
            docker buildx imagetools inspect "ghcr.io/xeonice/${image}:${RELEASE_VERSION}"
          done

  promote-latest:
    # `deploy-console` is in this chain deliberately: `latest` moves only after
    # every deployed surface of the release exists.
    needs: [resolve-release, verify-image-set, deploy-console]
    # A dependency that is SKIPPED skips its dependents by default, and
    # `deploy-console` is skipped on a `workflow_dispatch` that did not ask for it.
    # Without this condition, adding the console to the chain would have silently
    # stopped `latest` from ever moving on a dispatch run — a regression introduced
    # by the coupling itself. So: promote when the image set verified AND the
    # console either published or was legitimately not attempted. A console FAILURE
    # still blocks the promote, which is the whole point.
    if: |
      always() &&
      needs.verify-image-set.result == 'success' &&
      (needs.deploy-console.result == 'success' || needs.deploy-console.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the complete image set to latest
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          for image in cap-api cap-web cap-aio-sandbox cap-boxlite-sandbox; do
            docker buildx imagetools create \
              --tag "ghcr.io/xeonice/${image}:latest" \
              "ghcr.io/xeonice/${image}:${RELEASE_VERSION}"
          done

  # Attach the SOURCE-FREE run package to the Release so anyone can run cap from
  # prebuilt images WITHOUT cloning: download these two files, fill .env, and
  # `docker compose -f docker-compose.prod.yml up -d` (release-and-versioning,
  # decision ④/⑤ — build/run split). Only on a real Release (not workflow_dispatch).
  #
  # This job ALSO generates and attaches the build-matched task-model attestation
  # asset (automate-task-model-attestation-in-ci): it runs after promote-latest,
  # so the image identity is final, and it derives the attested buildIdentity
  # from the SAME resolve-release `git_sha` output that was passed as the
  # cap-api GIT_SHA build-arg — never a separately-resolved SHA context.
  # `compatibilityChecksPassed` is attested only after the release commit's
  # "task model N-1 compatibility" check-run is verified successful via the
  # check-runs API (honesty split, design D1) — never assumed from workflow
  # adjacency.
  attach-run-assets:
    needs: [verify-run-package, resolve-release, promote-latest]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail the attestation path closed unless the release commit's N-1
      # compatibility check-run ACTUALLY concluded successfully. release.yml
      # triggers on release:published while the compat job lives in ci.yml on
      # the merged commit, so adjacency proves nothing — query the evidence.
      - name: Verify task model N-1 compatibility check-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GIT_SHA: ${{ needs.resolve-release.outputs.git_sha }}
        run: |
          result="$(gh api -X GET \
            "repos/${{ github.repository }}/commits/${RELEASE_GIT_SHA}/check-runs" \
            -f check_name='task model N-1 compatibility' \
            --jq '[.check_runs[]] | sort_by(.id) | last | if . == null then "absent" else "\(.status):\(.conclusion)" end')" || {
            echo "error: could not query check-runs for ${RELEASE_GIT_SHA} — refusing to attest compatibilityChecksPassed" >&2
            exit 1
          }
          echo "task model N-1 compatibility check-run for ${RELEASE_GIT_SHA}: ${result}"
          if [ "$result" != "completed:success" ]; then
            echo "error: the release commit's 'task model N-1 compatibility' check-run is ${result} — refusing to attest compatibilityChecksPassed" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The generator validates its output against the UNCHANGED contracts
      # attestation schema, which it loads from the built dist output.
      - name: Build contracts schema for attestation validation
        run: pnpm --filter @cap-console/contracts build

      - name: Generate task model attestation asset
        env:
          RELEASE_GIT_SHA: ${{ needs.resolve-release.outputs.git_sha }}
        run: |
          node scripts/generate-task-model-attestation.mjs \
            --version "${{ github.event.release.tag_name }}" \
            --git-sha "${RELEASE_GIT_SHA}" \
            --compat-verified true \
            --out dist/task-model-attestation

      # SHA-context drift guard: the attested buildIdentity must equal the
      # GIT_SHA build-arg baked into the released cap-api image (both come from
      # resolve-release, and this assertion keeps that invariant from silently
      # regressing if either side is ever rewired).
      - name: Assert attested buildIdentity matches the api image GIT_SHA build-arg
        env:
          RELEASE_GIT_SHA: ${{ needs.resolve-release.outputs.git_sha }}
        run: |
          asset="dist/task-model-attestation/cap-task-model-attestation-${{ github.event.release.tag_name }}.json"
          jq -e --arg sha "$RELEASE_GIT_SHA" \
            '(.reports | length) == 4 and ([.reports[].buildIdentity] | all(. == $sha))' \
            "$asset" >/dev/null || {
            echo "error: attested buildIdentity drifted from the cap-api GIT_SHA build-arg (${RELEASE_GIT_SHA})" >&2
            exit 1
          }

      - name: Attach source-free run package and task-model attestation to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            docker-compose.prod.yml docker-compose.prod.env.example \
            dist/task-model-attestation/* \
            --clobber --repo "${{ github.repository }}"

  # The hosted console, published by the release and by nothing else.
  #
  # Vercel's git integration used to publish it on every merge to `main`, which
  # made the console a SECOND version of the product: `apps/web/vercel.json` now
  # sets `git.deploymentEnabled.main = false`, and this job is what replaces it.
  # Pull-request previews are untouched — a preview deploys from its own branch,
  # which stays enabled by default, and carries no version claim.
  #
  # `needs: verify-image-set`, and `promote-latest` in turn needs THIS job. So the
  # order is build → verify → console → move `latest`. A console that fails to
  # publish therefore leaves `latest` pointing at the previous release, where the
  # images and the console still match, instead of at a release whose console
  # never shipped.
  #
  # VITE_BUILD_ID is the same value release.yml already bakes into the cap-web
  # IMAGE (see the build-args block above). Passing it here is what closes the gap
  # that made `buildId()` return a real version from the image and the literal
  # "dev" from the console anyone actually used.
  #
  # SECRETS: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are created by the
  # operator. Without them this job fails and, by `needs`, the release reports a
  # failure rather than quietly shipping images with a stale console.
  deploy-console:
    needs: [resolve-release, verify-image-set]
    # A real Release always publishes the console. A manual run only does so when
    # explicitly asked, so `deploy_console: true` is the rehearsal switch.
    if: >-
      github.event_name == 'release' ||
      inputs.deploy_console == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail early when the deploy credentials are absent
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Named individually rather than as one check, because "one of three is
          # missing" is the failure an operator has to act on and a single
          # combined message does not say which.
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "deploy-console: FATAL — repository secret ${name} is unset." >&2
              missing=1
            fi
          done
          if [[ "${missing}" -eq 1 ]]; then
            echo "The release publishes the console; without these it cannot, and" >&2
            echo "shipping the images alone is the split-version state this job exists" >&2
            echo "to prevent. Create them in the repository settings and re-run." >&2
            exit 1
          fi

      # The link is WRITTEN, not inherited from the environment.
      #
      # `VERCEL_ORG_ID` / `VERCEL_PROJECT_ID` as env vars are the classic CI
      # recipe and this CLI does not honour them: with both set and no `.vercel`
      # directory, `vercel pull` still fails with "Could not retrieve Project
      # Settings". What `--yes` then does is worse than failing — it CREATES a new
      # project named after the directory (`apps/web` → `web`) and deploys there.
      # Measured, not theorised: a rehearsal did exactly that, producing
      # `prj_IqSLA4eEEdP9wvQmjZ11mCsSA2vq` while `cap-console.douglasdong.com`
      # stayed on its previous build. The release would have gone green, moved
      # `latest`, and left the console untouched — the silent half-release this
      # whole job exists to prevent, reintroduced by its own plumbing.
      # From the REPOSITORY ROOT, not `apps/web`. The cap-web project carries
      # `Root Directory = apps/web` in its own settings, which `pull` writes into
      # the local link — so running the CLI inside `apps/web` makes it resolve
      # `apps/web/apps/web` and fail with "The provided path … does not exist".
      # Also measured rather than reasoned about.
      - name: Link the build directory to the cap-web project
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' \
            "${{ secrets.VERCEL_ORG_ID }}" "${{ secrets.VERCEL_PROJECT_ID }}" \
            > .vercel/project.json

      # A REHEARSAL MUST NOT BE ABLE TO MOVE PRODUCTION. `deploy_console` exists so
      # this job can be exercised without cutting a release; if that exercise
      # published the production console it would not be a rehearsal, it would be a
      # release of the console alone — the split-version state this whole change
      # exists to prevent, delivered by its own test switch.
      #
      # It is not hypothetical. Rehearsing right after this change landed would have
      # published a console sending `x-cap-console-build` to a deployed api built
      # before that header was admitted, and every request would have died at the
      # CORS preflight. So a real Release deploys to production; anything else
      # deploys a preview, which exercises the identical chain — pull, link
      # assertion, build, deploy, version proof — against a URL that carries no
      # version claim.
      - name: Decide the deploy target
        id: target
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'release' ]]; then
            echo 'environment=production' >> "$GITHUB_OUTPUT"
            echo 'prod=--prod' >> "$GITHUB_OUTPUT"
            echo 'deploy-console: target = PRODUCTION (a published Release)'
          else
            echo 'environment=preview' >> "$GITHUB_OUTPUT"
            echo 'prod=' >> "$GITHUB_OUTPUT"
            echo 'deploy-console: target = PREVIEW (rehearsal; production is only moved by a Release)'
          fi

      - name: Deploy the console at the release version
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes \
            --environment='${{ steps.target.outputs.environment }}' \
            --token "${{ secrets.VERCEL_TOKEN }}"
          # `pull` rewrites project.json from the server. Re-assert the target
          # rather than trusting it: linking to the wrong project is the failure
          # that looks like success.
          node -e '
            const fs = require("fs");
            const link = JSON.parse(fs.readFileSync(".vercel/project.json", "utf8"));
            const want = process.env.EXPECTED_PROJECT_ID;
            if (link.projectId !== want) {
              console.error(`deploy-console: FATAL — linked to ${link.projectId} (${link.projectName ?? "?"}), expected ${want}.`);
              process.exit(1);
            }
            console.log(`deploy-console: linked to ${link.projectName ?? link.projectId}`);
          '
          # Refuse to build without the identity rather than baking the sentinel and
          # discovering it downstream. The proof step below is a presence check; this
          # is the precondition it cannot express.
          if [[ -z "${VITE_BUILD_ID:-}" ]]; then
            echo "deploy-console: FATAL — VITE_BUILD_ID is empty, so the console would" >&2
            echo "bake the \"dev\" sentinel and the api would refuse it." >&2
            exit 1
          fi
          npx --yes vercel@latest build ${{ steps.target.outputs.prod }} \
            --token "${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest deploy --prebuilt ${{ steps.target.outputs.prod }} \
            --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          EXPECTED_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # THE BUILD ID HAS TO BE PASSED HERE. `vite.config.ts` defines it as
          # `process.env.VITE_BUILD_ID ?? "dev"`, evaluated in whatever process runs
          # the build — so a `vercel build` that inherits no such variable bakes the
          # sentinel. That is EXACTLY the defect this change exists to remove: the
          # value was plumbed end to end on the image path and not at all on the
          # Vercel one, so `buildId()` returned a real version from the image and the
          # literal "dev" from the console anyone actually used. Omitting it here
          # would have reintroduced it in the job that fixes it, and the api now
          # REFUSES a sentinel from a deployed console, so the release would ship a
          # console the api rejects.
          VITE_BUILD_ID: ${{ needs.resolve-release.outputs.version }}

      - name: Prove the deployed console carries the release version
        run: |
          set -euo pipefail
          # The deploy reporting success is not evidence the version reached the
          # bundle: the whole defect this change fixes was a build that succeeded
          # while VITE_BUILD_ID silently defaulted. Assert the value is present in
          # the built output rather than trusting the exit code.
          expected='${{ needs.resolve-release.outputs.version }}'
          if [[ -z "${expected}" ]]; then
            echo "deploy-console: FATAL — no release version to assert." >&2
            exit 1
          fi
          # As a QUOTED literal. Vite replaces the compile-time value with
          # `JSON.stringify(...)`, so the baked id appears in the bundle with its
          # quotes; a bare substring search would also match the version turning up
          # in a source-map path or a comment and report success for a build that
          # baked the sentinel. This assertion is still presence-only — it cannot
          # prove WHICH expression the literal came from — which is why the step
          # above refuses to build at all when the variable is unset. Two weak checks
          # on the same fact, on purpose: the value was silently defaulting for the
          # entire life of the Vercel path before anything looked.
          if ! grep -rqF -- "\"${expected}\"" .vercel/output 2>/dev/null; then
            echo "deploy-console: FATAL — the release version ${expected} is not present" >&2
            echo "as a baked literal in the built console output. VITE_BUILD_ID did" >&2
            echo "not reach the bundle, so this console would present the \"dev\"" >&2
            echo "sentinel — which the api refuses from a deployed console." >&2
            exit 1
          fi
          echo "deploy-console: the built console carries ${expected}"

  attach-sandbox-image-assets:
    needs: promote-latest
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo zstd
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package sandbox image Release assets
        run: |
          node scripts/release-image-assets.mjs package \
            --version "${{ github.event.release.tag_name }}" \
            --owner xeonice \
            --out dist/release-image-assets \
            --cleanup-images
      - name: Attach sandbox image assets to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/release-image-assets/* \
            --clobber --repo "${{ github.repository }}"
