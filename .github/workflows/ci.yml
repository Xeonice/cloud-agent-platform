name: CI

# Strict typecheck + lint + unit-test gate (add-ci-typecheck-gate +
# guard-runtime-selection-regression). The release/build workflows only transpile
# (Docker/vite), so strict `tsc` errors could land on main undetected; this enforces
# the monorepo-foundation `turbo typecheck lint build` contract on changes, AND now
# runs the API and Web unit suites so behavioral regressions (for example runtime
# selection or schedule-history rendering) fail CI instead of shipping silently.
#
# boot-smoke gate (api-key-machine-identity, design D6 / monorepo-foundation spec
# "CI boots the built application and probes liveness", gap G5): a SEPARATE job
# boots the BUILT app against a throwaway Postgres and probes `/health`, so a
# cross-provider DI / onApplicationBootstrap ordering break — the failure class
# that build + unit tests provably MISS (it manifests only at DI-graph
# instantiation) and that caused a multi-hour production outage — fails CI here
# instead of in production. It runs independently of typecheck+lint (its own job);
# its required-check status is stated once, truthfully, at the job itself.
on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the repo.
permissions:
  contents: read

jobs:
  # Which parts of the tree a change touches. Its own job so the results are
  # available to `needs:`, and dependency-free (a git diff, not a marketplace
  # action) so nothing new enters the supply chain for a path check.
  #
  # NOT used to gate `public-surface-parity` or `typecheck + lint + test`: both
  # are REQUIRED status checks on `main`, and a required check that is skipped
  # rather than reported blocks a merge permanently. That is the same class of
  # silent failure as an unconditioned job wasting minutes, in the opposite
  # direction and worse, so those two continue to run for every change.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `backend` is true when a change can reach the api, its Prisma schema, any
      # workspace package it builds on, or the dependency graph itself. It is
      # deliberately broad: a false negative silently skips a gate, while a false
      # positive only costs the minutes the job would have taken anyway.
      #
      # `web` (close-gate-blindspots 7.2/7.3) is the same construction for the
      # console: true when a change can reach apps/web, a workspace package it
      # builds on, or the toolchain. Same fail-open shape, same broadness
      # rationale.
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "no usable base ref; treating as backend- and web-affecting" >&2
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "changed files:" >&2
          echo "${CHANGED}" >&2
          # Fails OPEN by construction: `backend` starts true and is lowered only
          # on grep's exit code 1, which means a definite no-match. An error
          # (exit >1) leaves it true, so a broken filter runs the gates rather
          # than silently skipping them.
          #
          # A here-string, not a pipe. The first version of this piped into
          # `grep -q`; CI logged `echo: write error: Broken pipe` on that line and
          # the filter reported no backend changes for a branch that rewrites the
          # api throughout. The exact mechanism was not reproducible locally even
          # at the same input size, which is itself the reason the logic above no
          # longer depends on getting it right.
          BACKEND=true
          set +e
          grep -qE '^(apps/api/|packages/|scripts/|\.github/workflows/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)' <<<"${CHANGED}"
          MATCH_STATUS=$?
          set -e
          if [[ "${MATCH_STATUS}" -eq 1 ]]; then
            BACKEND=false
          fi
          echo "grep exit ${MATCH_STATUS} -> backend=${BACKEND}" >&2
          echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
          # Same fail-open construction for the web lanes: WEB starts true and
          # only a definite no-match (grep exit 1) lowers it.
          WEB=true
          set +e
          grep -qE '^(apps/web/|packages/|\.github/workflows/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)' <<<"${CHANGED}"
          WEB_MATCH_STATUS=$?
          set -e
          if [[ "${WEB_MATCH_STATUS}" -eq 1 ]]; then
            WEB=false
          fi
          echo "grep exit ${WEB_MATCH_STATUS} -> web=${WEB}" >&2
          echo "web=${WEB}" >> "$GITHUB_OUTPUT"

  # Stable merge-gating context for the shared Public V1/MCP contract. Branch
  # protection must require the exact context `public-surface-parity` after this
  # job has reported once; hooks and CI intentionally call the same root command.
  public-surface-parity:
    name: public-surface-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify Public V1/MCP parity
        env:
          # PRs compare the complete base branch; pushes compare the full event
          # range. The runner fails closed if this explicit base is unavailable.
          CAP_PUBLIC_SURFACE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm verify:public-surface

  task-model-n-minus-one-compat:
    name: task model N-1 compatibility
    # Subject is api sources plus the Prisma client; unreachable from a docs- or console-only change.
    # Not a required status check, so a skip cannot block a merge.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate current Prisma client
        run: pnpm --filter @cap-console/api prisma:generate

      - name: Exercise pinned N-1 REST and MCP writers
        env:
          TASK_MODEL_N_MINUS_ONE_EVIDENCE: ${{ runner.temp }}/task-model-n-minus-one/evidence.json
        run: pnpm --filter @cap-console/api test:compat:task-model-n-minus-one

      - name: Upload sanitized N-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-model-n-minus-one-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-model-n-minus-one/evidence.json
          if-no-files-found: ignore
          retention-days: 7

  task-admission-migration-compatibility:
    name: task admission migration compatibility
    # Subject is api sources plus a live database migration; unreachable from a docs- or console-only change.
    # Not a required status check, so a skip cannot block a merge.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cap
          POSTGRES_PASSWORD: cap
          POSTGRES_DB: cap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap -d cap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cap:cap@localhost:5432/cap?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cap-console/api prisma:generate

      - name: Task admission fresh, upgrade, and rollback compatibility
        env:
          CAP_TASK_ADMISSION_MIGRATION_TEST: "1"
        run: pnpm --filter @cap-console/api test:migration:task-admission

  typecheck-lint:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    # The only job here without one. Without a cap an unforced hang inherits
    # GitHub's 360-minute default, and this job now runs suites whose runners
    # no longer force-exit — see apps/api/package.json.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `turbo build` first: it generates the codegen prerequisites that `turbo
      # typecheck` needs but does NOT itself depend on — the @cap-console/web route tree
      # (TanStack Start vite plugin), the @cap-console/api Prisma client (its build script),
      # and the @cap-console/contracts / @cap-console/ui dist types. Two separate invocations
      # guarantee every build (hence every generated input) is done before any
      # typecheck runs.
      - name: Build + terminal response-profile source conformance
        run: pnpm turbo build && pnpm verify:terminal-response-profile

      - name: Typecheck + lint (strict)
        run: pnpm turbo typecheck lint

      # Every test file must be reachable by some runner. This gate compares the
      # test files on disk against what the packages' configured patterns would
      # execute and fails on the difference — the mechanism that stops the
      # hand-written mounting allowlist from growing back (40 files in apps/api
      # alone had accumulated behind it). It also self-tests, so the gate itself
      # is provably able to fail.
      - name: Test discovery gate
        run: pnpm test:discovery

      # The agent-runtime spec forbids branching on WHICH agent is running in code
      # shared across runtimes, and asks for a grep that finds zero matches. Nobody
      # ran that grep, so the rule depended on review from the day it was written
      # and had drifted into 16 violations — including the two areas the
      # requirement names by hand. This runs it. Like the discovery gate, it
      # self-tests, so it is provably able to fail.
      - name: Agent-identity branch gate
        run: pnpm test:agent-identity

      # The provider axis: `sandbox-provider-port` requires one capability
      # vocabulary and that a provider not advertise a capability its
      # conformance does not exercise. Most of that is now a type problem (total
      # mappings, one provider-family declaration). This gate covers the two
      # parts a type cannot: no new duplicate capability spelling, and no
      # provider suite that builds conformance outside the participation ledger.
      - name: Provider contract parity gate
        run: pnpm test:provider-parity

      # `packages/sandbox-core` declares zero runtime dependencies, so its types
      # can derive from the contracts package (`import type` is erased) but its
      # runtime arrays cannot — `validateEnum` consumes them as values, and a
      # value import would give a deliberately dependency-free package a
      # dependency on zod. Ten vocabularies therefore exist twice on purpose,
      # and until now they agreed only because whoever edited one remembered the
      # other; the family list had already been restated in four places whose
      # contents disagreed. This compares the member sets. Like the gates above,
      # it self-tests, so it is provably able to fail.
      - name: Sandbox vocabulary parity gate
        run: pnpm test:vocabulary-parity

      # `packages/contracts` is the one package both apps depend on and is about
      # to be published. The property that makes it that package rather than a
      # junk drawer is that everything in it is shared, and nothing checked it:
      # this tree carried six dead modules and thirteen types a consumer had
      # re-declared while every other gate was green. This fails on an export
      # nothing can reach — imported by no consumer, composed into no other
      # export, and with no live schema/type twin — with an exception list that
      # requires a reason per entry. Self-tests, so it is provably able to fail.
      - name: Contracts shared-export gate
        run: pnpm test:contracts-shared

      # The other half of the same property. The gate above asks whether anything
      # NAMES a contract export; this asks whether anything RUNS it. They are
      # different questions: three shipped defects — the SMTP read body, the
      # /runtimes envelope, the admin-reveal response — were each a schema every
      # consumer imported the TYPE of and nobody ever parsed, so each declared a
      # rule the api was already contradicting with no signal anywhere. Parses
      # that happen through a registry or an in-package helper are declared, not
      # inferred. Self-tests, so it is provably able to fail.
      - name: Contracts executed-schema gate
        run: pnpm test:contracts-executed

      # The layout contract `monorepo-foundation` now states: package-internal
      # imports go through the alias (814 `../` traversals made every directory
      # unmovable), and directories do not depend on each other outside DI
      # composition (14 pairs did). The composition exemption is about the
      # IMPORTING file — a cycle with any ordinary-source import fails.
      - name: API module layout gate
        run: pnpm test:module-layout

      # Console request-header ↔ CORS allowlist consistency (G8). Until
      # close-gate-blindspots 5.3 this gate ran only by riding the
      # `test:scripts` glob below, where its failure was attributable solely by
      # reading suite output — a named step makes it a visible check like its
      # sibling gates above. The glob still mounts it; this direct invocation is
      # the visible, attributable one.
      - name: Console CORS-header gate
        run: pnpm test:cors-headers

      # App suites through the task graph. Previously three hand-named `pnpm
      # --filter` steps, which is the same allowlist failure mode one level up —
      # a new app owning tests would simply not run here. The directory filter
      # picks up any app that declares a `test` script.
      #
      # The former comment here warned that `turbo test` would nest turbo inside
      # turbo (each package's `pretest` runs `turbo run build`) and trip the 2.x
      # recursive-invocation guard. Re-tested on the current toolchain: the
      # nested invocation completes normally and the outer build above makes it a
      # cache hit. `pretest` is kept because it is what makes a direct
      # `pnpm --filter <pkg> test` build first — turbo's graph only applies when
      # the suite is entered through turbo.
      #
      # `--continue` so one failing app still reports the others; turbo prefixes
      # every line with its package, so attribution survives.
      - name: Test (app suites)
        run: pnpm turbo test --filter='./apps/*' --continue

      # These release/install contract suites live at the repository root rather
      # than inside a workspace package. Keep them in the required lane: the
      # Release-asset packager and its quick-deploy consumer must change together.
      # Repository-level test files — release/install contracts and the terminal
      # canaries — live outside every workspace package. This step used to NAME
      # eight of them, which is the hand-maintained allowlist `test-suite-discovery`
      # forbids inside a package script, merely one level up: sixteen further test
      # files sat beside them running nowhere, two of which had been broken since
      # 68c0907 with nobody to notice. `test:scripts` discovers them by pattern.
      - name: Test (repository-level scripts)
        run: |
          bash -n scripts/release.sh scripts/quick-deploy.sh scripts/scheduled-tasks-live-e2e.sh
          pnpm test:scripts

  # Workspace package suites. Split from the app lane so a sandbox failure is
  # attributable on sight and cannot mask an api regression — and because these
  # had NEVER gated a merge before: the whole sandbox family, including the
  # provider conformance suites that are the only cross-check binding a
  # provider's declared capabilities to its actual method surface, was reachable
  # only through a root script that no workflow invoked.
  #
  # Directory filter rather than a package list: a new package that declares a
  # `test` script joins this lane automatically, which is the failure mode this
  # whole change exists to remove.
  package-suites:
    name: package suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--continue` so one failing package still reports the rest; turbo
      # prefixes each line with its package name, so attribution survives.
      - name: Test (workspace packages)
        run: pnpm turbo test --filter='./packages/*' --continue

  # Boots the BUILT @cap-console/api orchestrator against a throwaway Postgres and probes
  # the unauthenticated `/health` liveness endpoint, failing the pipeline on any
  # bootstrap / DI error. A SEPARATE job (runs independently of typecheck+lint) so
  # this guard is unaffected by — and not blocked behind — the lint gate.
  #
  # add-private-account-identity (task 10.3): the smoke ALSO exercises the
  # default-admin SEED + ARGON2 path. `scripts/boot-smoke.sh` boots with
  # `ADMIN_EMAIL` set (so the `AdminSeedService` boot hook actually runs and
  # argon2-hashes a generated password) and then probes the one-time
  # `POST /auth/admin/reveal`; a missing/incompatible `@node-rs/argon2` native
  # binary or a broken seed fails CI here, not in production. No extra step is
  # needed — the script self-provides a throwaway `ADMIN_EMAIL` default.
  #
  boot-smoke:
    name: boot-smoke
    # Subject is boots the built api against a database; unreachable from a docs- or console-only change.
    # NOT a required status check, and it cannot be marked one as-is: the job is
    # conditioned via `needs: changes`, and a required check that is SKIPPED
    # rather than reported blocks a merge permanently (close-gate-blindspots 5.1
    # resolved the contradictory claim that used to sit here in favor of this
    # reality). Making it required means unconditioning it first — in the same
    # change that flips branch protection.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Throwaway Postgres the orchestrator's Prisma layer connects to at boot. A
    # service container is the disposable DB the spec calls for; it is wiped with
    # the runner, never persisted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cap
          POSTGRES_PASSWORD: cap
          POSTGRES_DB: cap
        ports:
          - 5432:5432
        # Gate the steps below until Postgres is accepting connections, so
        # `prisma migrate deploy` never races the DB coming up.
        options: >-
          --health-cmd "pg_isready -U cap -d cap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point Prisma at the service container (mapped to localhost on the runner).
      DATABASE_URL: postgresql://cap:cap@localhost:5432/cap?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build the api (and its workspace deps): produces apps/api/dist/main.js and
      # generates the Prisma client the boot needs. This is the SAME built artifact
      # the container CMD runs, so a DI break surfaces here exactly as in prod.
      - name: Build (@cap-console/api + deps)
        run: pnpm turbo build --filter=@cap-console/api

      # Prove predecessor rows survive the additive model-selection migration,
      # then reset the throwaway schema for the ordinary boot smoke below.
      - name: Task model migration compatibility
        env:
          CAP_TASK_MODEL_MIGRATION_TEST: "1"
        run: pnpm --filter @cap-console/api test:migration:model

      # Migrate the throwaway DB, boot the built app, probe /health. The helper
      # exits non-zero (and dumps the app log) on any migration / bootstrap / DI /
      # liveness failure — the signal this job gates on.
      - name: Boot smoke (/health)
        run: bash scripts/boot-smoke.sh

      # Real Postgres + the actual polling timer. This guards the manual-dispatch
      # and future-fire interaction that service fakes alone cannot prove.
      - name: Scheduled tasks integration
        run: pnpm test:integration:schedules

      # Real AppModule + Postgres contract parity across Console REST, Public V1,
      # MCP structured tools and schedule create/update/fire/recovery. External
      # catalog/provision boundaries are deterministic; every application-owned
      # controller, service and database write/read path remains production code.
      - name: Task model cross-surface integration
        run: pnpm test:integration:task-model-surfaces

  # STATEFUL boot smoke (close-gate-blindspots-and-ci-hygiene 6.2, monorepo-
  # foundation "CI boots the built application and probes liveness"): the job
  # above boots against an EMPTY database, which is precisely the state
  # production never restarts in. This SECOND job pre-seeds an in-flight
  # `running` task row (live durable-admission lease) into its own throwaway
  # Postgres BEFORE boot, then asserts the restarted process RE-ADOPTED it —
  # still running, still owned, not force-failed as an orphan. That is the
  # survive-api-redeploy failure class (the 042c8ea split-brain regression) that
  # clean-boot liveness and unit fakes both provably missed.
  #
  # A separate job, not a step in `boot-smoke`: the clean-boot job stays
  # byte-identical (no context change), and this one carries a stable `name:`
  # ("boot-smoke-stateful") so it can later be marked a required status check
  # without a rename — after unconditioning it, since a conditioned required
  # check that skips blocks merges permanently (see boot-smoke above).
  boot-smoke-stateful:
    name: boot-smoke-stateful
    # Subject boots the built api against a database; unreachable from a docs-
    # or console-only change. Not a required status check, so a skip cannot
    # block a merge.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Same throwaway-Postgres service pattern as the clean-boot job: wiped with
    # the runner, never persisted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cap
          POSTGRES_PASSWORD: cap
          POSTGRES_DB: cap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cap -d cap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cap:cap@localhost:5432/cap?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (@cap-console/api + deps)
        run: pnpm turbo build --filter=@cap-console/api

      # Migrate, pre-seed the in-flight running task, boot the BUILT app, probe
      # /health, then assert re-adoption (not failed / orphaned / unowned).
      # The flag is the only delta from the clean-boot invocation; with it unset
      # scripts/boot-smoke.sh is byte-identical to what the job above runs.
      - name: Boot smoke with work in flight (re-adoption)
        env:
          BOOT_SMOKE_STATEFUL: "1"
        run: bash scripts/boot-smoke.sh

  # Console visual regression (close-gate-blindspots 7.2, test-suite-discovery
  # "visual lanes pin their rendering environment and review their baselines").
  # Runs INSIDE the pinned Playwright image — the exact environment the manifest
  # thresholds were measured in (apps/web/e2e/visual/manifest.ts header; the
  # image tag MUST equal the resolved @playwright/test version in pnpm-lock.yaml,
  # bump the two together per apps/web/e2e/visual-baseline-regeneration.md).
  # Mac-rendered thresholds do not transfer to Linux; the pin is what makes the
  # committed thresholds meaningful here.
  #
  # The gate compares the app against the COMMITTED design baseline
  # (apps/web/e2e/design-baseline/, screenshotted fresh into a gitignored dir at
  # the start of every run) using the manifest's per-page thresholds. Nothing in
  # this job regenerates or writes the committed baseline: regeneration is the
  # reviewed, developer-side procedure (`sync-design-baseline.mjs`, which needs
  # the local OD workspace and is deliberately NOT a CI step; its `--check`
  # guards drift at regeneration time).
  web-visual:
    name: web visual regression
    # Subject is the rendered console; unreachable from an api- or docs-only
    # change. Not a required status check, so a skip cannot block a merge.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # playwright-image-pin — keep equal to @playwright/test in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web dependencies
        run: pnpm turbo build --filter=@cap-console/web^...

      - name: Visual regression (manifest thresholds, in-pin)
        run: pnpm --filter @cap-console/web test:visual

  # Terminal stories lane (close-gate-blindspots 7.3, test-suite-discovery "a
  # declared suite runs in some CI lane or is deleted"). A DISTINCT lane with
  # its own config (playwright.terminal-stories.config.ts): the visual lane
  # masks live terminal content to keep pixel thresholds meaningful, which is
  # exactly what this suite must never do — it asserts the terminal's actual
  # rendered frames. Same pin, same reasoning as web-visual.
  web-terminal-stories:
    name: web terminal stories
    # Subject is the rendered console terminal; unreachable from an api- or
    # docs-only change. Not a required status check, so a skip cannot block a merge.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # playwright-image-pin — keep equal to @playwright/test in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web dependencies
        run: pnpm turbo build --filter=@cap-console/web^...

      - name: Terminal stories (in-pin)
        run: pnpm --filter @cap-console/web test:terminal-stories

  # Full owner-authenticated schedule story. Unlike the fast Postgres integration
  # above, this boots the real AppModule and console, drives them through a browser,
  # and proves the real poller reaches TasksService, Guardrails, audit recording,
  # and the sandbox-provider port. The runner allocates all ports dynamically and
  # owns its uniquely named disposable Postgres container.
  scheduled-tasks-e2e:
    name: scheduled tasks browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @cap-console/web exec playwright install --with-deps chromium

      - name: Scheduled tasks live E2E
        timeout-minutes: 10
        env:
          SCHEDULE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/scheduled-tasks-e2e
        run: pnpm test:e2e:schedules:local

      - name: Sanitize scheduled-task E2E evidence
        if: always()
        env:
          SCHEDULE_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/scheduled-tasks-e2e
        run: |
          if [[ -d "$SCHEDULE_E2E_ARTIFACT_ROOT" ]]; then
            if ! node scripts/sanitize-scheduled-tasks-e2e-artifacts.mjs "$SCHEDULE_E2E_ARTIFACT_ROOT"; then
              rm -rf -- "$SCHEDULE_E2E_ARTIFACT_ROOT"
              exit 1
            fi
          fi

      - name: Upload scheduled-task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-tasks-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduled-tasks-e2e
          if-no-files-found: ignore
          retention-days: 7
