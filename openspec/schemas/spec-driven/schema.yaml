name: spec-driven
version: 1
description: Default OpenSpec workflow - proposal → specs → design → tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      STEP 0 — DEEP RESEARCH (do this before writing the proposal):

      If the Claude Code Workflow capability is available, run the
      `opsx-propose-deep` workflow with args { changeName, changeDir, idea } to
      fan out parallel research (web + codebase scan + prior-change archive) and
      write a `research-brief.md` side-car file into the change directory; then
      ground the proposal in that brief. If Workflow is unavailable, do a
      lightweight serial research pass yourself and still write `research-brief.md`.
      `research-brief.md` is a side-car file, NOT a tracked artifact — the
      dependency graph is unchanged.


      Then create the proposal document that establishes WHY this change is
      needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      TRACK FORMAT (enables track-based parallel apply):

      - Each numbered group is a parallel **Track**. Write group headers as:
      `## N. Track: <kebab-name> (depends: <track-name>[, ...] | none)`

      - Each task MUST be a checkbox: `- [ ] N.Y Task description`

      - Tasks WITHIN a track run serially in declared order; order them by
      intra-track dependency.

      - Cross-track dependencies go ONLY in the track's `depends` list, never
      inside a task line.

      - Group by DISJOINT files/modules so independent tracks run in parallel;
      tasks that must edit a shared file belong together in ONE track.

      - Tasks should be small enough to complete in one session.

      - This is a best-effort DRAFT partition — the apply phase will correct it
      against real file coupling.


      BUDGET — tasks per requirement SHALL NOT exceed 2.5.

      Measured across four archived changes, ceremony cost runs INVERSELY to
      requirement count: the widest change (33 requirements / 31 tasks / ratio
      0.9) passed verify in one round with zero rework, while the narrowest (14
      requirements / 73 tasks / ratio 5.2) took three rounds and re-opened two
      tasks. Over phase 4 the ratio climbed 1.9 → 3.3 → 5.2 as each change added
      prose tasks defending against the previous change's failure. That accretion,
      not scope, is what makes a change expensive.

      - Count before you finish: `tasks ÷ requirements ≤ 2.5`. Over budget means
      the DEFENCES are wrong-shaped, not that the work is large.

      - A defence against a known failure mode belongs in `assertions.json` as one
      executable line, NOT in `tasks.md` as a paragraph. A prose task must be
      re-read by a human and by every verify lens, every round, forever; an
      assertion is decided by its command in milliseconds and keeps its
      requirement out of the adversarial path entirely.

      - Do not write a task whose whole content is "confirm X" where X is
      greppable or countable. Write the assertion instead and let R12 decide it.


      ASSERTIONS — write `assertions.json` beside `tasks.md`.

      Every requirement whose scenarios a command can decide (counts, byte
      identity, zero-match greps, gate exit codes) SHALL carry assertions naming
      it, so `node scripts/spec-assert.mjs <change>` decides it and verify never
      spends an LLM pass on it. Requirements needing a human reading — "the
      artifact states the reason", design intent, honesty of a record — carry no
      assertion and stay on the adversarial path, which is what that path is for.
      A requirement nobody asserts is never reported as decided, so a forgotten
      assertion costs budget rather than correctness.


      NUMBERS — every number entering an artifact carries the command that
      produced it AND its counting convention.

      An off-by-one in the convention (`4131 − 2000` versus `4131 − 1999`) is
      invisible without it. A number describing a tree that does not exist yet has
      exactly two legal forms: labelled `[predicted]` with the command that would
      confirm or refute it, or produced by SIMULATE-THEN-MEASURE — construct the
      post-change text and run the real gate's own measurement function over it.
      Simulate-then-measure is what caught "WriteGate 4 → 0" and "8 → 2" as false,
      and what caught a planned edit that would have left a ratchet unmoved.


      SCOPE — a domain change SHALL NOT modify the harness.

      If verification tooling proves broken mid-change, open a separate change for
      it. Editing the harness inside a domain change cost two full verify rounds
      once already: the fix landed on the same branch, broke a fixture that
      compiles the workflow source, and turned four public-surface evidence lanes
      red for a change whose public surface had not moved.


      Example:

      ```

      ## 1. Track: scaffolding (depends: none)


      - [ ] 1.1 Create new module structure

      - [ ] 1.2 Add dependencies to package.json


      ## 2. Track: core-export (depends: scaffolding)


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      Reference specs for what needs to be built, design for how to build it.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Implement the change, then verify it. Two stages:

    STAGE 1 — IMPLEMENT (serial vs parallel-track):
    - Count PENDING tasks (`- [ ]`). Threshold = 12 (mirrored as
      APPLY_PARALLEL_THRESHOLD in .claude/workflows/opsx-apply-tracks.js).
    - If the Claude Code Workflow capability is available AND pending tasks >= 12:
      run the `opsx-apply-tracks` workflow with args { changeName, changeDir,
      buildCmd? }. It corrects the track partition, implements tracks in parallel
      git worktrees, integrates, and verifies the build. Do NOT report success if
      it returns success:false (red build).
    - Otherwise (Workflow unavailable, or < 12 pending tasks): work through pending
      tasks serially, marking each `- [ ]` -> `- [x]` as you go. This serial path
      is always correct. Pause on blockers or unclear requirements.

    STAGE 2 — VERIFY (completion gate; folded here because the schema has no
    archive/post-apply hook):
    - If Workflow is available, run the `opsx-verify` workflow with args
      { changeName, changeDir }. It proves every spec requirement is satisfied via
      static triage + high-risk dynamic/adversarial checks, and routes findings
      (unmet -> reopened tasks in tasks.md; spec-defect -> design Open Questions;
      met -> verification-report.md).
    - The change is NOT done while verify returns pass:false. Surface the unmet
      requirements (now reopened as tasks) and loop back to STAGE 1.
    - If Workflow is unavailable, note "verify gate skipped" and rely on the build
      check only.
